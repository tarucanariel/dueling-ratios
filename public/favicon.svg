<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="1" stop-color="#150f36"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00d2ff"/>
      <stop offset="1" stop-color="#8a2be2"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- mirrors the game's own fraction-block layout: number, vinculum,
       number, stacked — same shape gameplay already uses, just reduced
       to its simplest form so it reads clearly at 16px -->
  <circle cx="256" cy="168" r="56" fill="url(#fg)"/>
  <rect x="136" y="242" width="240" height="30" rx="15" fill="url(#fg)"/>
  <circle cx="256" cy="344" r="56" fill="url(#fg)"/>
</svg>
